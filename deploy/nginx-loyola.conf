# Origin for the dedicated `loyola` cloudflared tunnel.
# TLS terminates at Cloudflare, so there is no certificate here — this listens
# on loopback only and is unreachable from the internet except via the tunnel.
server {
    listen 127.0.0.1:8090;
    server_name loyola.avlokai.com;

    # ID card photos from a modern phone are a few MB; 20M leaves headroom
    # without letting anyone push a video through the verification endpoint.
    client_max_body_size 20M;

    access_log /var/log/nginx/loyola.access.log;
    error_log  /var/log/nginx/loyola.error.log;

    # Static assets are served straight off disk rather than through uvicorn,
    # which matters on a single core. They are mirrored out of /root — nginx
    # runs as www-data and cannot traverse root's home directory.
    location /static/ {
        alias /var/www/loyola/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # The Android APK is ~50 MB and often comes down over campus wifi. Buffering
    # it through nginx to a temp file first adds latency and disk churn on a
    # single-core box, and the default send timeout would cut a slow phone off
    # mid-download — which, for an update, means it never finishes.
    location /api/v1/updates/android/download/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://loyola.avlokai.com https://loyola.avlokai.com;

        # OCR on a single core takes several seconds for a card; the read
        # timeout has to outlast it or verification fails at the proxy.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
