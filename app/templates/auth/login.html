{% extends "base.html" %}
{% block shell_class %}shell shell--full{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div style="max-width:400px;margin:2.5rem auto 0">
  <div class="page-head">
    <div>
      <h1>Sign in</h1>
      <p class="lede">Use your username or your roll number.</p>
    </div>
  </div>

  <form class="panel" method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next|default('/') }}">
    <div class="panel-body">
      <div class="field">
        <label for="identifier">Username or roll number</label>
        <input id="identifier" name="identifier" type="text" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
    </div>
    <div class="panel-foot">
      <button type="submit" class="btn btn--block">Sign in</button>
    </div>
  </form>

  <p class="center muted" style="margin-top:1rem">
    New here? <a href="/signup">Create an account</a>
  </p>
  <p class="center muted" style="font-size:0.84rem">
    Forgotten your password? A moderator can reset it — <a href="/support">ask for help</a>.
  </p>
</div>
{% endblock %}
